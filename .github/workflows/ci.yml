name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node 構文検査
        run: |
          node --check backend/api/api.mjs
          node --check backend/api/mqttProvision.mjs
          node --check backend/ingest/ingest.mjs
          node --check web/api.js
          node --check web/simulator/simulator.js
      - name: ダミー .env 生成 (compose 検証用・CI のみ)
        run: |
          printf 'PGPASSWORD=dummy-pg-password\nPOSTGRES_PASSWORD=dummy-pg-password\nJWT_SECRET=dummy-jwt-secret\nDYNSEC_ADMIN_PASSWORD=dummy-dynsec-password\nMQTT_PASS=dummy-mqtt-password\nADMIN_PASSWORD=dummy-admin-password\nLEGACY_MQTT_USERS=car01:dummy-pass\n' > docker/backend/.env
      - name: compose 設定検証
        run: |
          docker compose -f docker/mosquitto/docker-compose.yml config -q
          docker compose -f docker/backend/docker-compose.yml config -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: テスト用 .env 生成 (CI限界値)
        run: |
          PG_PWD=$(openssl rand -hex 16)
          printf 'PGPASSWORD=%s\n' "$PG_PWD" > docker/backend/.env
          printf 'POSTGRES_PASSWORD=%s\n' "$PG_PWD" >> docker/backend/.env
          printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 16)" >> docker/backend/.env
          printf 'DYNSEC_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 16)" >> docker/backend/.env
          printf 'MQTT_PASS=%s\n' "$(openssl rand -hex 16)" >> docker/backend/.env
          printf 'ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 16)" >> docker/backend/.env
          printf 'LEGACY_MQTT_USERS=car01:ci-car01-pass\n' >> docker/backend/.env
      - name: Mosquitto 起動 (dynsec 初期化込み)
        run: |
          docker compose -f docker/mosquitto/docker-compose.yml up -d
          sleep 2
          # パスワードはホスト側で抽出する ($(...) をコンテナ内で評価すると
          # docker/backend/.env がコンテナに無く空パスワードになる)
          DYNSEC_PWD=$(grep '^DYNSEC_ADMIN_PASSWORD=' docker/backend/.env | cut -d= -f2)
          docker run --rm -v carpal-mosquitto_mosquitto-data:/mosquitto/data eclipse-mosquitto:2 \
            sh -c "mosquitto_ctrl dynsec init /mosquitto/data/dynamic-security.json admin '$DYNSEC_PWD'" || true
          # dynsec ファイルが Mosquitto 起動前に無い場合に備えて再初期化→再起動
          docker compose -f docker/mosquitto/docker-compose.yml restart
      - name: バックエンド起動 (postgres + ingest + api)
        run: |
          docker compose -f docker/backend/docker-compose.yml up -d --build
          sleep 15
      - name: API E2E (18チェック)
        run: ./scripts/api_e2e.sh
      - name: MQTT プロビジョニング E2E (9チェック)
        run: ./scripts/e2e_mqtt_provision.sh

  fw-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: arduino-cli インストール
        run: curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
      - name: esp32 コアインストール
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: LilyGO ライブラリ取得
        run: git clone --depth 1 https://github.com/Xinyuan-LilyGO/LilyGO-T-SIM7080G /tmp/lilygo-libs
      - name: ArduinoJson v7 インストール (LilyGO 同梱 v5 を除去)
        run: |
          rm -rf /tmp/lilygo-libs/lib/ArduinoJson-5
          arduino-cli lib install ArduinoJson@7.4.2
      - name: ダミー secrets.h 生成
        run: cp firmware/carpal_tracker/secrets.h.example firmware/carpal_tracker/secrets.h
      - name: コンパイル検証
        run: |
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,FlashMode=qio" \
            --libraries /tmp/lilygo-libs/lib \
            firmware/carpal_tracker
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,FlashMode=qio" \
            --libraries /tmp/lilygo-libs/lib \
            firmware/ltem_diag
