# Mosquitto 2.x 用設定 (carpal 用)
# Docker: docker/mosquitto/ をコンテナの /mosquitto/config にマウント
#
# 認証: 組込み Dynamic Security (dynsec) を使用 (Phase 2-c)
# - ユーザー/ACL は API (backend/api) が $CONTROL トピック経由で動的管理
# - 静的 passwd_file / acl_file は廃止 (acl_file は参照用に残置)
# - 設定ファイルは data ボリュームに永続化される

allow_anonymous false

# ---------- Dynamic Security プラグイン ----------
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# ---------- TCP (デバイス: ESP32 用 / テスト用 CLI も) ----------
listener 1883
protocol mqtt
allow_anonymous false

# ---------- WebSockets (フロントエンド: Leaflet 用) ----------
listener 9001
protocol websockets
allow_anonymous false

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# ログ仕様: docs/logging-design.md §3.3
log_type error
log_type warning
log_type notice
log_type information
log_type debug

# 環境固有リスナー (デバイス用 TLS 8883 など) は conf.d/ に分離。
# LAN ベンチでは conf.d/ を空にする (bench = 平文 1883 のみ)。
# 本番 (LXC carpal-backend) では docker-compose.override.yml で conf.d に
# TLS 8883 リスナーを追加する (docs/backend-design.md §2.4)。
include_dir /mosquitto/conf.d
