# Mosquitto 2.x 用設定 (carpal 用)
# Docker: docker/mosquitto/ をコンテナの /mosquitto/config にマウント

allow_anonymous false

# ---------- TCP (デバイス: ESP32 用 / テスト用 CLI も) ----------
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl_file

# ---------- WebSockets (フロントエンド: Leaflet 用) ----------
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl_file

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# ログ仕様: docs/logging-design.md §3.3
log_type error
log_type warning
log_type notice
log_type information
