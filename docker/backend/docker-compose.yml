services:
  postgres:
    image: postgres:16-alpine
    container_name: carpal-postgres
    restart: unless-stopped
    # NOTE: POSTGRES_PASSWORD は初回ボリューム作成時のみ使用。
    # 実運用パスワードはローテーション済み (docker/backend/.env の PGPASSWORD)。
    environment:
      POSTGRES_USER: carpal
      POSTGRES_PASSWORD: localdev-only
      POSTGRES_DB: carpal
    volumes:
      - pgdata:/var/lib/postgresql/data

  ingest:
    build:
      context: ../../backend/ingest
    container_name: carpal-ingest
    restart: unless-stopped
    depends_on:
      - postgres
    env_file: .env   # シークレット: MQTT_PASS / PGPASSWORD (gitignore済み)
    environment:
      MQTT_URL: mqtt://host.docker.internal:1883
      MQTT_USER: webuser
      PGHOST: postgres
      PGUSER: carpal
      PGDATABASE: carpal
      PORT: 3000
      RETENTION_DAYS: "90"
      EVENT_RETENTION_DAYS: "730"
    ports:
      - "3000:3000"   # 履歴API (LANベンチ用。公開時はCaddy経由+認証)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: ../../backend/api
    container_name: carpal-api
    restart: unless-stopped
    depends_on:
      - postgres
    env_file: .env   # シークレット: JWT_SECRET / DYNSEC_ADMIN_PASSWORD / PGPASSWORD / ADMIN_PASSWORD / MQTT_PASS (gitignore済み)
    environment:
      PGHOST: postgres
      PGUSER: carpal
      PGDATABASE: carpal
      PORT: 3001
      ADMIN_EMAIL: admin@carpal.local
      MQTT_URL: mqtt://host.docker.internal:1883   # dynsec 管理 (MQTT認証プロビジョニング)
      DYNSEC_ADMIN_USER: admin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"

volumes:
  pgdata:
