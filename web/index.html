<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>carpal — リアルタイム車両追跡</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 L19 22 L12 17 L5 22 Z' fill='%231565c0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- MQTT over WebSockets 用ライブラリ -->
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <!-- ローカル設定 (認証情報はここで渡す。コミットしないこと — config.local.example をコピー) -->
  <script src="./config.local.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    #map { height: 100%; }
    #info {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: rgba(255,255,255,.9); padding: 8px 12px; border-radius: 6px;
      font: 13px/1.6 sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .car-icon { transition: transform .8s linear; } /* 回転をスムーズに */
    .car-marker { display: flex; flex-direction: column; align-items: center; font: bold 11px sans-serif; }
    #adminLink {
      position: absolute; bottom: 52px; left: 12px; z-index: 1000;
      background: rgba(255,255,255,.95); border: 1px solid #bbb; border-radius: 6px;
      padding: 6px 12px; font: 13px sans-serif;
    }
    #historyBtn {
      position: absolute; bottom: 18px; left: 12px; z-index: 1000;
      background: rgba(255,255,255,.95); border: 1px solid #bbb; border-radius: 6px;
      padding: 6px 12px; font: 13px sans-serif; cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    #historyBtn.on { background: #1565c0; color: #fff; border-color: #1565c0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="info">接続中…</div>
  <button id="historyBtn">📚 履歴を表示</button>
  <a id="adminLink" href="devices.html">⚙ デバイス管理</a>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { startVehicleSubscription } from './mqtt.js';

    const MAX_VEHICLES = 3;
    const STALE_MS = 60000; // この時間更新が無い車両はオフライン扱い

    // ---------- 地図 ----------
    // 初期ビュー: 前回の表示範囲を復元 (なければ東京駅)
    let savedView = null;
    try { savedView = JSON.parse(localStorage.getItem('carpal.view') || 'null'); } catch (e) {}
    const map = L.map('map').setView(
      savedView ? [savedView.lat, savedView.lng] : [35.6812, 139.7671],
      savedView?.zoom ?? 13
    );
    // ユーザー操作後の表示範囲を保存 (次回オープン時に復元)
    map.on('moveend', () => {
      const c = map.getCenter();
      try {
        localStorage.setItem('carpal.view', JSON.stringify({ lat: c.lat, lng: c.lng, zoom: map.getZoom() }));
      } catch (e) {}
    });

    // 測位位置への自動センタリング (初回の1回のみ。復元済みなら実施しない)
    let didAutoCenter = !!savedView;

    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
      attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
      maxZoom: 18,
    }).addTo(map);

    const CAR_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24">
      <path d="M12 2 L19 22 L12 17 L5 22 Z" fill="#1565c0" stroke="#fff" stroke-width="1.5"/>
    </svg>`;

    const markers = {}; // id -> { marker, divIcon, lastTs, trail }

    function ensureMarker(id) {
      if (markers[id]) return markers[id];
      const div = document.createElement('div');
      div.className = 'car-marker';
      div.innerHTML = `<span class="car-icon" style="width:34px;height:34px;display:block;">${CAR_SVG}</span><span>${id}</span>`;
      const icon = L.divIcon({ html: div, className: '', iconSize: [34, 34], iconAnchor: [17, 17] });
      const marker = L.marker([0, 0], { icon }).addTo(map);
      const trail = L.polyline([], { color: '#1565c0', weight: 3, opacity: .5 }).addTo(map);
      return (markers[id] = { marker, iconEl: div.querySelector('.car-icon'), trail, lastTs: 0 });
    }

    // ---------- MQTT 購読 ----------
    startVehicleSubscription((id, d) => {
      const m = ensureMarker(id);

      if (!Number.isFinite(d.lat) || !Number.isFinite(d.lng)) return;

      // 車両の移動をなめらかに見せる（CSS transition + 位置更新）
      m.marker.setLatLng([d.lat, d.lng]);

      // 進行方向へ回転。brg が無い場合は移動差分から計算（フォールバック）
      let brg = d.bearing;
      if (brg == null && m.lastLatLng) {
        const prev = m.lastLatLng, cur = L.latLng(d.lat, d.lng);
        if (prev.distanceTo(cur) > 2) {
          brg = bearingDeg(prev.lat, prev.lng, cur.lat, cur.lng);
        }
      }
      m.lastLatLng = L.latLng(d.lat, d.lng);
      if (brg != null) m.iconEl.style.transform = `rotate(${brg}deg)`;

      // 軌跡（直近100点）
      m.trail.addLatLng([d.lat, d.lng]);
      if (m.trail.getLatLngs().length > 100) m.trail.spliceLatLngs(0, 1);

      // 測位位置への自動センタリング (セッション中最初の1回のみ)
      if (!didAutoCenter) {
        didAutoCenter = true;
        map.setView([d.lat, d.lng], 14);
      } else if (!map.getBounds().pad(0.15).contains(m.marker.getLatLng())) {
        // 復元ビューなどでマーカーが画面外の場合は追従して見えるようにする
        map.setView(m.marker.getLatLng(), Math.max(map.getZoom(), 12));
      }

      m.lastTs = Date.now();
      updateInfo();
    }, (id, s) => {
      // LWT/Retain status を即時反映 (監査 N-6 対策)
      const m = ensureMarker(id);
      m.lastTs = s.online ? Date.now() : 0;
      updateInfo();
    });

    // ---------- 補助 ----------
    function bearingDeg(lat1, lng1, lat2, lng2) {
      const rad = Math.PI / 180;
      const y = Math.sin((lng2 - lng1) * rad) * Math.cos(lat2 * rad);
      const x = Math.cos(lat1 * rad) * Math.sin(lat2 * rad)
              - Math.sin(lat1 * rad) * Math.cos(lat2 * rad) * Math.cos((lng2 - lng1) * rad);
      return (Math.atan2(y, x) / rad + 360) % 360;
    }

    const info = document.getElementById('info');
    function updateInfo() {
      const now = Date.now();
      const ids = Object.keys(markers).slice(0, MAX_VEHICLES);
      info.innerHTML = ids.length
        ? ids.map(id => {
            const m = markers[id];
            const online = now - m.lastTs < STALE_MS;
            return `${id}: <span style="color:${online ? 'green' : 'red'}">●</span> ${online ? '走行中' : 'オフライン'}`;
          }).join('<br>')
        : '車両を待機中…';
    }
    setInterval(updateInfo, 5000);

    // ---------- 移動履歴表示 (ingest 履歴API) ----------
    const deviceColor = (id) => {
      let h = 0;
      for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return `hsl(${h % 360} 65% 40%)`;
    };
    let historyLayers = [];
    let historyOn = false;
    const historyBtn = document.getElementById('historyBtn');

    async function toggleHistory() {
      if (historyOn) {
        historyLayers.forEach(l => map.removeLayer(l));
        historyLayers = [];
        historyOn = false;
        historyBtn.classList.remove('on');
        historyBtn.textContent = '📚 履歴を表示';
        return;
      }
      historyBtn.disabled = true;
      try {
        // https 配信時は同一オリジン (/api/history → ingest) 、LANベンチは ingest 直結
        const HIST_BASE = location.protocol === 'https:'
          ? '' : `http://${location.hostname}:3000`;
        const res = await fetch(`${HIST_BASE}/api/history?hours=24`);
        if (!res.ok) throw new Error(`API ${res.status}`);
        const { devices } = await res.json();
        for (const [id, points] of Object.entries(devices)) {
          if (points.length < 2) continue;
          const latlngs = points.map(p => [p.lat, p.lng]);
          const line = L.polyline(latlngs, {
            color: deviceColor(id), weight: 3, opacity: 0.7,
            dashArray: '6 6',
          }).addTo(map).bindTooltip(`${id} の履歴 (${points.length}点)`);
          historyLayers.push(line);
        }
        historyOn = true;
        historyBtn.classList.add('on');
        historyBtn.textContent = '📚 履歴を非表示';
        if (historyLayers.length) map.fitBounds(historyLayers[0].getBounds().pad(0.2));
        console.log(`[carpal] history drawn: ${Object.keys(devices).length} devices`);
      } catch (e) {
        console.error('[carpal]', 'HISTORY_ERROR', e.message);
        alert(`履歴の取得に失敗しました: ${e.message}`);
      } finally {
        historyBtn.disabled = false;
      }
    }
    historyBtn.addEventListener('click', toggleHistory);

    // 自動検証用デバッグフック (マーカー座標をテストから参照可能にする)
    window.__carpalDebug = { map, markers, toggleHistory, getHistoryLayers: () => historyLayers };
  </script>
</body>
</html>
