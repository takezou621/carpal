<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carpal — 車両・駐車監視</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <header><h1>Carpal</h1><span id="status" role="status">接続してください</span></header>
  <form id="connect">
    <label>API トークン <input id="token" type="password" required autocomplete="off"></label>
    <button>接続</button>
    <button id="disconnect" type="button">切断</button>
  </form>
  <main>
    <div id="map" aria-label="車両位置の地図"></div>
    <aside>
      <h2>車両</h2>
      <div id="vehicles"></div>
      <h2>駐車監視イベント</h2>
      <p>車両を選択してください。監視中に衝撃を検出すると写真を記録します。</p>
      <div id="events"></div>
    </aside>
  </main>
</body>
</html>
