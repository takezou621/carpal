<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>carpal — ログイン</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 L19 22 L12 17 L5 22 Z' fill='%231565c0'/%3E%3C/svg%3E">
  <style>
    body { font-family: system-ui, sans-serif; background: #f0f2f5; display: flex;
           align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #fff; padding: 36px 40px; border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,.12); width: 320px; }
    h1 { font-size: 20px; margin: 0 0 20px; color: #1565c0; }
    label { display: block; font-size: 12px; color: #555; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 14px;
            border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; margin-top: 20px; padding: 11px; font-size: 14px; font-weight: bold;
             background: #1565c0; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .6; }
    .err { color: #c62828; font-size: 13px; margin-top: 12px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚗 carpal 管理ログイン</h1>
    <form id="form">
      <label>メールアドレス</label>
      <input type="email" id="email" required autocomplete="username">
      <label>パスワード</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" id="btn">ログイン</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <script type="module">
    import { login, auth } from './api.js';
    if (auth.loggedIn) location.href = 'devices.html';

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      btn.disabled = true;
      err.textContent = '';
      try {
        await login(
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        location.href = 'devices.html';
      } catch (ex) {
        err.textContent = ex.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
